<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极速全格式转换器</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; padding: 40px; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #444; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { font-size: 14px; color: #aaa; margin-top: 10px; }
        .tips { font-size: 12px; color: #666; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎬 全格式转换 (本地版)</h2>
    <p style="font-size: 14px; color: #ff9800;">无需上传，保护隐私</p>
    
    <input type="file" id="fileInput">
    <select id="format">
        <option value="mp4">转换为 MP4</option>
        <option value="mp3">转换为 MP3 (提取音频)</option>
        <option value="gif">转换为 GIF</option>
        <option value="avi">转换为 AVI</option>
    </select>
    
    <button id="btn" onclick="process()">开始转换</button>
    <div id="status">等待选择文件...</div>

    <div class="tips">
        <b>💡 必读说明：</b><br>
        1. 如果双击打开后报错 <b>"SharedArrayBuffer"</b>，请不要直接双击 HTML。<br>
        2. 请使用 Edge 或 Chrome 浏览器。<br>
        3. <b>终极解决：</b>如果还是打不开，建议下载本地软件 <b>Handbrake</b> 或 <b>格式工厂</b>，那才是最稳的方案。
    </div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    async function process() {
        const file = document.getElementById('fileInput').files[0];
        const format = document.getElementById('format').value;
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');

        if (!file) return alert("请先选择文件！");

        try {
            btn.disabled = true;
            status.innerText = "正在初始化引擎 (首次较慢)...";
            
            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            status.innerText = "正在转换中，请勿关闭页面...";
            ffmpeg.FS('writeFile', 'input', await fetchFile(file));
            await ffmpeg.run('-i', 'input', `out.${format}`);

            const data = ffmpeg.FS('readFile', `out.${format}`);
            const url = URL.createObjectURL(new Blob([data.buffer]));
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `output_${Date.now()}.${format}`;
            a.click();
            
            status.innerText = "✅ 转换完成，已启动下载！";
        } catch (e) {
            status.innerText = "❌ 错误: " + e.message;
            console.error(e);
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
